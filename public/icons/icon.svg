<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D47A1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1976D2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA000;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="108" fill="url(#grad1)"/>
  <!-- Decorative Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="8"/>
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#gold)" stroke-width="4" stroke-dasharray="12 8"/>
  
  <!-- Central Emblem: Nepali Rupee symbol रु & Scales of Finance -->
  <g fill="#FFFFFF" text-anchor="middle" font-family="'Noto Sans', 'Segoe UI', sans-serif">
    <!-- Traditional Rupee Symbol -->
    <text x="256" y="270" font-size="160" font-weight="900" fill="url(#gold)" filter="drop-shadow(0px 8px 16px rgba(0,0,0,0.35))">रु</text>
    <!-- Label Below -->
    <text x="256" y="360" font-size="36" font-weight="700" letter-spacing="2" fill="#E3F2FD">अर्थ मन्त्रालय</text>
    <text x="256" y="400" font-size="20" font-weight="500" letter-spacing="3" fill="#BBDEFB">ARTHA MANTRALAYA</text>
  </g>
  <!-- Balance Pillars on Top -->
  <path d="M 180 140 L 332 140 L 320 160 L 192 160 Z" fill="url(#gold)"/>
  <circle cx="256" cy="130" r="14" fill="url(#gold)"/>
</svg>
